<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E2A2F">
<script>try{var t=localStorage.getItem('guia_gramado_2026_theme_last');if(!t&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)t='dark';if(t){document.documentElement.dataset.theme=t;if(t==='dark')document.querySelector('meta[name=theme-color]').content='#0B0F14';}}catch(e){}</script>
<title>Gramado 2026 · Natal Luz</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gramado 2026">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&family=Young+Serif&display=swap" rel="stylesheet">
<style>
:root{
  --snow:#EEF2F3; --paper:#FFFFFF; --field:#FFFFFF; --soft:#EDF1F2; --soft2:#F4F7F8; --track:#DDE6E8;
  --ink:#12262A; --muted:#55666A; --line:#D6DEE1;
  --night:#0E2A2F; --night2:#16393F; --gold:#E3A72F; --berry:#B3263E;
  --pri:#0E2A2F; --onpri:#FFFFFF; --onc:#FFFFFF;
  --head:#0E2A2F; --head2:#16393F; --headink:#FFFFFF; --headsub:#B7CBCE; --barbg:rgba(238,242,243,.94);
  --navbg:#0E2A2F; --navline:#284C52; --navink:#A9C0C3; --navon:#16393F; --navonink:#FFFFFF;
  --ok:#17663A; --okbg:#DFF1E5; --okfill:#1F8A4C; --warn:#8A5200; --warnbg:#FFF0CF; --noteink:#5A3A00;
  --bad:#B3263E; --badbg:#FCE3E7; --info:#22508F; --infobg:#E2EBF8; --slate:#3E5260; --slatebg:#E6ECF0;
  --c-voo:#2F6DB5; --c-carro:#0F7C80; --c-hotel:#4E54B8; --c-atracao:#8A3FB0; --c-refeicao:#B86A12; --c-outro:#5E6F73;
  --shadow:0 6px 18px rgba(18,38,42,.08);
  --serif:'Young Serif',Georgia,'Times New Roman',serif; --serifw:400;
  --sans:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
/* Tema escuro: Painel Noturno */
:root[data-theme="dark"]{
  --snow:#0B0F14; --paper:#151B23; --field:#0F141B; --soft:#1C2430; --soft2:#121820; --track:#222B36;
  --ink:#EEF2F6; --muted:#94A0AD; --line:#26303C;
  --night:#151B23; --night2:#1C2430;
  --pri:#EEF2F6; --onpri:#0B0F14; --onc:#0B0F14;
  --head:#0B0F14; --head2:#1C2430; --headink:#EEF2F6; --headsub:#94A0AD; --barbg:rgba(11,15,20,.92);
  --navbg:#151B23; --navline:#26303C; --navink:#94A0AD; --navon:#EEF2F6; --navonink:#0B0F14;
  --ok:#8FE0AE; --okbg:#122A1D; --okfill:#1F8A4C; --warn:#F2C46B; --warnbg:#33290F; --noteink:#F2D9A6;
  --bad:#FF8A9B; --badbg:#3A1A21; --info:#A9C8F5; --infobg:#1B2E4A; --slate:#C8D3DE; --slatebg:#2B3440;
  --c-voo:#7FB2EE; --c-carro:#5CC6C9; --c-hotel:#A3A8F4; --c-atracao:#D19BF0; --c-refeicao:#F2B562; --c-outro:#A9B6BF;
  --shadow:none;
  --serif:'Manrope',system-ui,-apple-system,sans-serif; --serifw:800;
  --sans:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--snow);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.42}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
a{color:var(--info)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- Cabeçalho com pisca-pisca ---------- */
.top{background:var(--head);color:var(--headink);padding:calc(14px + env(safe-area-inset-top)) 18px 0;position:relative}
.top h1{font-family:var(--serif);font-size:25px;font-weight:var(--serifw);letter-spacing:.2px}
.top .sub{color:var(--headsub);font-size:13px;margin-top:2px}
.top .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sync{font-size:12px;border-radius:20px;padding:4px 10px;background:var(--head2);color:var(--headsub);white-space:nowrap}
.sync.ok{color:#9FE3B8}.sync.saving{color:var(--gold)}.sync.offline,.sync.local{color:#F4B8C0}
.count{margin-top:10px;display:inline-block;background:var(--head2);border-radius:12px;padding:6px 12px;font-size:13px}
.count b{color:var(--gold);font-weight:700}
.lights{height:26px;margin:12px -18px 0;background:
  radial-gradient(circle at 12px 8px,var(--gold) 0 3.4px,transparent 4px) 0 0/48px 26px,
  radial-gradient(circle at 36px 8px,#D19BF0 0 3.4px,transparent 4px) 0 0/48px 26px,
  radial-gradient(circle at 24px 12px,#7FB2EE 0 3.4px,transparent 4px) 0 0/48px 26px;
  border-top:2px solid #284C52;opacity:.95;animation:glow 5s ease-in-out infinite alternate}
@keyframes glow{from{filter:brightness(.82)}to{filter:brightness(1.18)}}
@media (prefers-reduced-motion:reduce){.lights{animation:none}*{transition:none!important}}

/* ---------- Seletor de dias ---------- */
.days{position:sticky;top:0;z-index:20;background:var(--barbg);backdrop-filter:blur(8px);padding:calc(10px + env(safe-area-inset-top)) 12px 10px;display:flex;gap:8px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.dchip{flex:0 0 auto;min-width:56px;padding:6px 8px 7px;border-radius:14px;background:var(--paper);border:1px solid var(--line);text-align:center;position:relative}
.dchip small{display:block;font-size:11px;color:var(--muted)}
.dchip b{display:block;font-family:var(--serif);font-weight:var(--serifw);font-size:19px;line-height:1.1}
.dchip.on{background:var(--pri);border-color:var(--pri);color:var(--onpri)}
.dchip.on small{color:inherit;opacity:.75}
.dchip .dot{position:absolute;top:5px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.dchip .dot.g{background:var(--okfill)}
.dchip.today{box-shadow:0 0 0 2px var(--gold)}

main{padding:12px 12px 4px;max-width:720px;margin:0 auto}

/* ---------- Dia ---------- */
.hero{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:12px}
.hero h2{font-family:var(--serif);font-weight:var(--serifw);font-size:22px}
.hero .date{color:var(--muted);font-size:13px;margin-top:2px}
.bar{height:8px;border-radius:8px;background:var(--track);overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:var(--okfill);border-radius:8px;transition:width .3s}
.hero .prog{font-size:13px;color:var(--muted)}
.hero .note{margin-top:8px;font-size:13.5px;background:var(--warnbg);border-radius:10px;padding:8px 10px;color:var(--noteink)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.tbtn{padding:8px 12px;border-radius:12px;background:var(--paper);border:1px solid var(--line);font-size:13.5px;font-weight:600}
.tbtn.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.tbtn.gold{background:var(--gold);border-color:var(--gold);color:#2A1D00}

/* ---------- Cards ---------- */
.card{--c:#555;background:var(--paper);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;position:relative;overflow:hidden;box-shadow:0 1px 0 rgba(18,38,42,.04)}
.chead{display:flex;align-items:center;gap:8px;padding:7px 12px;background:color-mix(in srgb,var(--c) 12%,var(--paper));color:color-mix(in srgb,var(--c) 70%,var(--ink));font-size:12.5px;font-weight:700}
.chead .ci{font-size:15px}
.chead .grow{flex:1}
.chead .time{font-weight:700;font-variant-numeric:tabular-nums}
.pill{border-radius:20px;padding:2px 9px;font-size:11.5px;font-weight:700}
.pill.fixo{background:var(--c);color:var(--onc)}
.pill.sug{border:1.5px solid var(--c);color:color-mix(in srgb,var(--c) 70%,var(--ink));background:transparent}
.pill.opc{border:1px dashed var(--muted);color:var(--muted)}
.cbody{display:flex;gap:10px;padding:12px 12px 12px 14px;cursor:pointer}
.cbody .main{flex:1;min-width:0}
.cname{font-family:var(--serif);font-weight:var(--serifw);font-size:17px;line-height:1.2}
.csub{color:var(--muted);font-size:13.5px;margin-top:3px}
.side{display:flex;flex-direction:column;align-items:center;gap:8px}
.chk{width:44px;height:44px;border-radius:50%;border:2px solid var(--c);color:var(--c);font-size:21px;font-weight:800;display:grid;place-items:center;background:transparent;transition:background .15s,transform .15s}
.chk:active{transform:scale(.92)}
.kebab{width:36px;height:30px;font-size:20px;color:var(--muted);border-radius:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:8px;padding:3px 8px;background:var(--soft);color:var(--muted)}
.chip.cov-c{background:var(--okbg);color:var(--ok)}
.chip.cov-p{background:var(--warnbg);color:var(--warn)}
.chip.cov-a{background:var(--slatebg);color:var(--slate)}
.chip.free{background:var(--infobg);color:var(--info)}
.chip.paid{background:var(--soft);color:var(--muted)}
.chip.todo{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink);font-weight:700}
.chip.ok{background:var(--okbg);color:var(--ok)}
.chip.info{background:var(--infobg);color:var(--info)}
.chip.mute{background:var(--soft);color:var(--muted)}
.chip.rec{background:transparent;color:var(--muted);border:1px dashed var(--muted)}
.chip.bad{background:var(--badbg);color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad);font-weight:700}
.chip.maybe{background:var(--warnbg);color:var(--warn)}
.codeline{display:flex;align-items:center;gap:8px;margin-top:10px}
.codeline label{font-size:12px;color:var(--muted);white-space:nowrap}
.codein{flex:1;min-width:0;border:1.5px dashed var(--line);background:var(--field);border-radius:8px;padding:6px 9px;font-weight:700;letter-spacing:.5px}
.codein:focus{border-style:solid;border-color:var(--c);outline:none}

/* hierarquia */
.role-fixo{box-shadow:var(--shadow)}
.role-fixo .cname{font-size:19px}
.role-opc{background:transparent;border-style:dashed;border-color:color-mix(in srgb,var(--muted) 45%,var(--line))}
.role-opc .cname{font-size:15.5px}
.role-opc .chead{background:transparent;color:var(--muted)}
.role-opc .chead .ci{filter:grayscale(.4)}

/* identidade por categoria */
.cat-voo{border-radius:18px}
.cat-voo .route{display:flex;align-items:center;gap:10px;margin:4px 0 2px}
.cat-voo .route b{display:block;font-family:var(--serif);font-weight:var(--serifw);font-size:26px;line-height:1}
.cat-voo .route span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.cat-voo .route .ln{flex:1;text-align:center;font-size:12px;color:var(--muted);border-top:2px dashed color-mix(in srgb,var(--c) 55%,transparent);position:relative;padding-top:6px}
.cat-voo .route .ln:before{content:'✈';position:absolute;top:-13px;left:calc(50% - 8px);background:var(--paper);font-size:16px;color:var(--c)}
.vstub{border-top:2px dashed var(--line);position:relative;padding:2px 14px 12px}
.vstub .codeline{margin-top:8px}
.vstub:before,.vstub:after{content:'';position:absolute;top:-9px;width:16px;height:16px;border-radius:50%;background:var(--snow);border:1px solid var(--line)}
.vstub:before{left:-9px}.vstub:after{right:-9px}
.cat-voo .codein{font-family:var(--serif);font-size:18px;letter-spacing:2px;text-transform:uppercase}
.cat-voo .chead{background:var(--c);color:var(--onc)}
.cat-voo.role-opc .chead{background:transparent;color:var(--muted)}

.cat-atracao .cbody{position:relative}
.cat-atracao .side{border-left:2px dashed var(--line);padding-left:8px;position:relative}
.cat-atracao .side:before,.cat-atracao .side:after{content:'';position:absolute;left:-9px;width:16px;height:16px;border-radius:50%;background:var(--snow);border:1px solid var(--line)}
.cat-atracao .side:before{top:-18px}.cat-atracao .side:after{bottom:-18px}

.cat-refeicao{background:color-mix(in srgb,var(--c) 5%,var(--paper))}
.cat-refeicao:after{content:'';position:absolute;inset:4px;border:1px solid color-mix(in srgb,var(--c) 30%,transparent);border-radius:12px;pointer-events:none}
.cat-refeicao .cname{font-style:italic}
.cat-refeicao .chead{background:color-mix(in srgb,var(--c) 14%,var(--paper))}
.cat-refeicao.role-opc{background:transparent}
.cat-refeicao.role-opc .chead{background:transparent}

.cat-carro .chead{background:repeating-linear-gradient(-45deg,color-mix(in srgb,var(--c) 16%,var(--paper)) 0 10px,color-mix(in srgb,var(--c) 7%,var(--paper)) 10px 20px)}
.cat-carro .codein{background:#fff;color:#1A1A1A;border:2px solid #1F3C88;border-top:9px solid #1F3C88;border-radius:6px;text-align:center;font-weight:800;letter-spacing:3px;padding:3px 8px}

.cat-hotel .chead{background:var(--c);color:var(--onc);padding:9px 12px}
.cat-hotel .cname{font-size:20px}

/* estados */
.card.done{background:var(--okbg);border-color:color-mix(in srgb,var(--okfill) 45%,var(--line));box-shadow:none}
.card.done .cname{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--ok)}
.card.done .chk{background:var(--okfill);border-color:var(--okfill);color:#fff}
.card.done .chead{background:color-mix(in srgb,var(--okfill) 20%,var(--paper));color:var(--ok)}
.card.done.cat-voo .chead,.card.done.cat-hotel .chead{background:var(--okfill);color:#fff}
.card.sibdone{opacity:.55}
.card.rain-a{outline:2px solid var(--slate);outline-offset:-1px}
.card.rain-a:after{content:'Ao ar livre: confira a chuva';position:absolute;right:0;top:0;background:var(--slate);color:var(--snow);font-size:10.5px;font-weight:700;padding:2px 9px;border-bottom-left-radius:10px;z-index:2}

/* expandido */
.xbody{border-top:1px solid var(--line);padding:12px 14px 14px;background:color-mix(in srgb,var(--paper) 60%,transparent);font-size:14px}
.xgrid{display:grid;grid-template-columns:1fr;gap:6px;margin-bottom:10px}
.xrow{display:flex;gap:8px}
.xrow dt{flex:0 0 112px;color:var(--muted);font-size:12.5px;font-weight:600}
.xrow dd{margin:0;flex:1}
.xsec{margin-top:12px}
.xsec h4{font-size:13px;margin-bottom:6px;color:var(--c)}
.wk{display:flex;gap:5px}
.wk span{flex:1;text-align:center;border-radius:8px;padding:4px 0;font-size:11px;font-weight:700;background:var(--soft);color:var(--muted)}
.wk span b{display:block;font-size:13px;font-family:var(--serif);font-weight:var(--serifw)}
.wk .ok{background:var(--okbg);color:var(--ok)}.wk .closed{background:var(--badbg);color:var(--bad)}.wk .maybe{background:var(--warnbg);color:var(--warn)}
.wk .cur{box-shadow:0 0 0 2px var(--ink)}
.panel{background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{padding:7px 12px;font-size:13px;font-weight:700;background:var(--field);color:var(--muted)}
.seg button.on{background:var(--pri);color:var(--onpri)}
.seg button.on.g{background:var(--okfill);color:#fff}.seg button.on.r{background:var(--pri);color:var(--onpri)}
.prow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.prow label{font-size:12.5px;color:var(--muted);min-width:78px}
.fi{border:1.5px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--field);min-width:0}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{padding:9px 13px;border-radius:11px;background:var(--field);border:1.5px solid var(--line);font-weight:700;font-size:13.5px;text-decoration:none;color:var(--ink);display:inline-block}
.btn.pri{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.org{display:flex;gap:8px;padding:8px 12px;border-top:1px dashed var(--line);background:var(--soft2)}
.org button{flex:1;padding:9px;border-radius:10px;background:var(--field);border:1.5px solid var(--line);font-weight:700}
.org button:disabled{opacity:.35}
.detlist{margin:0;padding:0;list-style:none;display:grid;gap:7px}
.detlist li{padding-left:0}
.detlist b{font-weight:700}
.notes{white-space:pre-wrap;color:var(--ink)}

/* ---------- Pendências / listas ---------- */
.sec{font-family:var(--serif);font-weight:var(--serifw);font-size:19px;margin:18px 2px 8px}
.sec small{font-family:var(--sans);color:var(--muted);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.kpi b{display:block;font-family:var(--serif);font-weight:var(--serifw);font-size:26px;line-height:1.1}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.red b{color:var(--warn)}.kpi.grn b{color:var(--ok)}
.prowcard{--c:#555;background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:14px;padding:11px 12px;margin-bottom:10px}
.prowcard h4{font-family:var(--serif);font-weight:var(--serifw);font-size:16px}
.prowcard .where{font-size:13px;color:var(--muted);margin-top:2px}
.prowcard .hint{font-size:13px;margin-top:6px;color:var(--muted)}
.prowcard.recc{border-left-style:dashed}
.empty{padding:22px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:14px;background:var(--paper)}

/* ---------- Info ---------- */
.acc{background:var(--paper);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.acc>button{width:100%;text-align:left;padding:13px 14px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.acc .ab{padding:2px 14px 14px;font-size:14px}
.acc table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.acc td,.acc th{border-top:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
.acc th{color:var(--muted);font-weight:600}
.acc ul{margin:6px 0;padding-left:18px}
.acc li{margin:4px 0}
.chkrow{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.chkrow input{width:20px;height:20px;margin-top:1px;flex:0 0 auto;accent-color:var(--ok)}
.chkrow.is-on span{text-decoration:line-through;color:var(--muted)}
.lblg{font-size:12.5px;font-weight:700;color:var(--muted);margin:10px 0 2px}

/* ---------- Navegação ---------- */
nav.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--navbg);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-top:2px solid var(--navline)}
nav.nav button{flex:1;color:var(--navink);padding:6px 0;font-size:11.5px;font-weight:600;border-radius:12px;position:relative}
nav.nav button span{display:block;font-size:20px;line-height:1.2}
nav.nav button.on{color:var(--navonink);background:var(--navon)}
nav.nav .bdg{position:absolute;top:1px;left:calc(50% + 8px);background:var(--gold);color:#2A1D00;border-radius:10px;font-size:10.5px;padding:0 6px;font-weight:800}

/* ---------- Sheets ---------- */
.backdrop{position:fixed;inset:0;background:rgba(10,24,27,.55);z-index:50;display:none}
.backdrop.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--paper);border-radius:22px 22px 0 0;max-height:92vh;overflow:auto;padding:8px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease;max-width:720px;margin:0 auto}
.sheet.on{transform:none}
.sheet .grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 10px}
.sheet h3{font-family:var(--serif);font-weight:var(--serifw);font-size:20px;margin-bottom:10px}
.mi{display:flex;width:100%;text-align:left;gap:12px;padding:13px 6px;border-top:1px solid var(--line);font-weight:600;align-items:center}
.mi small{display:block;color:var(--muted);font-weight:400;font-size:12.5px}
.mi.danger{color:var(--bad)}
.field{margin-bottom:12px}
.field>label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:4px}
.field input[type=text],.field input[type=date],.field input[type=time],.field select,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--field)}
.field textarea{min-height:90px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cbx{display:flex;flex-wrap:wrap;gap:6px}
.cbx label{border:1.5px solid var(--line);border-radius:9px;padding:6px 10px;font-weight:700;font-size:13px;background:var(--field);color:var(--ink)}
.cbx input{margin-right:4px}
.fgroup{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:14px;background:var(--soft2)}
.fgroup>h4{font-size:13.5px;margin-bottom:10px;color:var(--ink)}
.help{font-size:12.5px;color:var(--muted);margin-top:4px}
.opt{display:flex;gap:10px;align-items:center;padding:11px 4px;border-top:1px solid var(--line)}
.opt .grow{flex:1;min-width:0}
.opt b{font-family:var(--serif);font-weight:var(--serifw)}
.opt small{display:block;color:var(--muted);font-size:12.5px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--pri);color:var(--onpri);padding:10px 16px;border-radius:12px;z-index:80;font-size:14px;max-width:88vw;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.login{min-height:70vh;display:grid;place-items:center;padding:30px 20px;text-align:center}
.login h2{font-family:var(--serif);font-weight:var(--serifw);font-size:26px;margin-bottom:8px}
.login p{color:var(--muted);margin-bottom:18px}
.search{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--field);margin-bottom:8px}
.fchips{display:flex;gap:6px;overflow-x:auto;margin-bottom:6px;scrollbar-width:none}
.fchips button{flex:0 0 auto;padding:6px 11px;border-radius:20px;border:1.5px solid var(--line);background:var(--paper);font-size:13px;font-weight:700}
.fchips button.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}

.mapb{width:36px;height:30px;display:grid;place-items:center;font-size:18px;text-decoration:none;border-radius:8px;background:var(--soft)}
/* ---------- Tema, ícones de categoria, linha do tempo ---------- */
.top .row>.tr{display:flex;align-items:center;gap:8px}
.thm{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;background:var(--head2);color:var(--gold);flex:0 0 auto}
.thm svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico{width:22px;height:22px;border-radius:7px;background:var(--c);color:var(--onc);display:grid;place-items:center;flex:0 0 auto}
.ico svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.cat-voo .chead .ico,.cat-hotel .chead .ico{background:var(--onc);color:var(--c)}
.role-opc .ico{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--muted)}
.card.done .ico{background:var(--okfill);color:#fff}
.card.done.cat-voo .chead .ico,.card.done.cat-hotel .chead .ico{background:#fff;color:var(--okfill)}
.prowcard h4{display:flex;align-items:center;gap:8px}
.segbar{display:flex;gap:4px;margin:12px 0 6px}
.segbar i{flex:1;height:8px;border-radius:4px;box-shadow:inset 0 0 0 1.5px var(--c)}
.segbar i.on{background:var(--c);box-shadow:none}
.tl{list-style:none;margin:0;padding:0}
.tli{display:flex;gap:8px}
.tlt{flex:0 0 40px;display:flex;flex-direction:column;align-items:center;padding-top:8px}
.tlt span{font-size:12.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;min-height:17px}
.tlt i{width:12px;height:12px;border-radius:6px;background:var(--c);margin-top:5px;box-shadow:0 0 0 4px var(--snow)}
.tlt i.opc{background:var(--snow);box-shadow:inset 0 0 0 2px var(--c),0 0 0 4px var(--snow)}
.tlt i.ok{background:var(--okfill);box-shadow:0 0 0 4px var(--snow)}
.tlt:after{content:'';flex:1;width:2px;background:var(--line);margin:3px 0 0}
.tli:last-child .tlt:after{background:transparent}
.tlc{flex:1;min-width:0}
.tlc .chead .time{display:none}
.rainp{border-color:color-mix(in srgb,var(--info) 40%,var(--line))!important;background:var(--infobg)!important}
.next{border-radius:22px;padding:16px;margin-bottom:12px;background:color-mix(in srgb,var(--c) 86%,#000);color:#fff}
.next .nl{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;opacity:.9}
.next .nl .ico{background:#fff;color:var(--c)}
.next .nt{display:flex;align-items:baseline;gap:10px;margin-top:8px}
.next .nt b{font-size:40px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;font-family:var(--sans)}
.next h2{font-family:var(--serif);font-weight:var(--serifw);font-size:21px;margin-top:6px}
.next p{font-size:13.5px;opacity:.9;margin-top:2px}
.next .btns .btn{background:rgba(255,255,255,.16);border-color:transparent;color:inherit}
.next .btns .btn.pri{background:#fff;color:#111}
/* Escuro: Painel Noturno */
:root[data-theme="dark"] .lights{display:none}
:root[data-theme="dark"] .top{padding-bottom:12px;border-bottom:1px solid var(--line)}
:root[data-theme="dark"] .top h1{font-size:22px;letter-spacing:-.01em}
:root[data-theme="dark"] .cname,:root[data-theme="dark"] .hero h2,:root[data-theme="dark"] .sec,:root[data-theme="dark"] .next h2{letter-spacing:-.01em}
:root[data-theme="dark"] .cat-refeicao .cname{font-style:normal}
:root[data-theme="dark"] .card,:root[data-theme="dark"] .hero{border-radius:18px}
:root[data-theme="dark"] .next{background:color-mix(in srgb,var(--c) 24%,var(--snow));color:var(--ink)}
:root[data-theme="dark"] .next .nl .ico{background:var(--c);color:var(--onc)}
:root[data-theme="dark"] .next .btns .btn{background:color-mix(in srgb,var(--c) 36%,var(--snow))}
:root[data-theme="dark"] .next .btns .btn.pri{background:var(--ink);color:var(--snow)}
:root[data-theme="dark"] body{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
:root[data-theme="dark"] nav.nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));padding:6px;border-radius:24px;border:1px solid var(--line);max-width:700px;margin:0 auto;box-shadow:0 10px 30px rgba(0,0,0,.45)}
:root[data-theme="dark"] nav.nav button{border-radius:18px}
:root[data-theme="dark"] .thm{background:var(--soft);color:var(--ink)}

/* ---------- Despesas realizadas ---------- */
.dexp{display:flex;align-items:stretch;gap:6px;margin-top:10px}
.dexp .dsum{flex:1;min-width:0;text-align:left;padding:6px 10px;border-radius:12px;background:var(--soft);font-size:12px;color:var(--muted);line-height:1.25}
.dexp .dsum b{display:block;font-size:17px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.dexp .dsum b.pos{color:var(--ok)}
.dexp .db{min-height:44px;padding:0 11px;border-radius:12px;border:1.5px solid var(--line);background:var(--field);font-weight:700;font-size:13px;white-space:nowrap}
.spent{display:inline-flex;align-items:center;gap:4px;margin-top:8px;font-size:11.5px;font-weight:700;color:var(--ok);font-variant-numeric:tabular-nums;padding:2px 0}
.spent small{font-weight:600;opacity:.8}
.spendb{margin-top:8px;font-size:12px;font-weight:700;color:var(--muted);border:1px dashed color-mix(in srgb,var(--muted) 55%,var(--line));border-radius:8px;padding:4px 9px}
.money{font-size:26px!important;font-weight:800;font-variant-numeric:tabular-nums}
.extop{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:4px 0 10px}
.extop b{font-size:28px;font-weight:800;color:var(--ok);font-variant-numeric:tabular-nums}
.extop span{font-size:13px;color:var(--muted)}
.exr{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;width:100%;text-align:left}
.exr .grow{flex:1;min-width:0}
.exr small{display:block;color:var(--muted);font-size:12px}
.exr b{font-variant-numeric:tabular-nums;color:var(--ok);white-space:nowrap}
.exr .x{width:36px;height:36px;border-radius:18px;color:var(--muted);font-size:18px;flex:0 0 auto}
.exday{display:flex;justify-content:space-between;font-weight:800;font-size:13.5px;margin:14px 0 2px}
.exday span:last-child{color:var(--ok);font-variant-numeric:tabular-nums}
.excat td:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.sheet.dlg{left:16px;right:16px;top:50%;bottom:auto;max-width:440px;border-radius:20px;padding:18px 16px 16px;transform:translateY(-50%) scale(.96);opacity:0;pointer-events:none;transition:opacity .15s ease,transform .15s ease;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.sheet.dlg.on{transform:translateY(-50%);opacity:1;pointer-events:auto}
.sheet.dlg .btns .btn{flex:1;min-height:44px}
.sheet.dlg .btns .btn.pri{flex:2}

function pendList(){
  const out=[];
  Object.values(S.acts).forEach(a=>{
    if(a.active===false) return;
    const pls=actPlacements(a.id).filter(([,p])=>S.acts[p.act]); if(!pls.length) return;
    const pi=pendInfo(a);
    const ess=pls.some(([,p])=>p.role!=='opc');
    const first=pls[0][1];
    out.push({a,pls,ess,first,...pi,done:!pi.any&&(a.buy!=='na'||a.sched==='date'||a.sched==='time')});
  });
  return out.sort((x,y)=>(x.first.day.localeCompare(y.first.day))||((x.first.time||'99').localeCompare(y.first.time||'99')));
}
function pendCard(x){
  const a=x.a; const cat=CAT[a.cat]; const rec=a.req==='rec';
  const where=x.pls.map(([,p])=>dayShort(p.day)+(p.tag?' ('+p.tag+')':'')).join(', ');
  const [bt]=buyWords(a.cat);
  const miss=[]; if(x.needBuy) miss.push(`<span class="chip ${rec?'rec':'todo'}">🎟 ${bt}</span>`);
  if(x.needSched) miss.push(`<span class="chip ${rec?'rec':'todo'}">${a.sched==='time'?'⏰ '+(a.cat==='refeicao'?'Reservar mesa':'Marcar horário'):'📅 Marcar data'}</span>`);
  if(rec) miss.push('<span class="chip mute">recomendado, não obrigatório</span>');

/* ---------- Despesas realizadas ---------- */
function parseBRL(x){
  if(x==null) return 0; let t=String(x).replace(/[^\d,.]/g,''); if(!t) return 0;
  if(t.includes(',')) t=t.replace(/\./g,'').replace(',','.');
  else { const p=t.split('.'); if(p.length>2||(p.length===2&&p[1].length===3)) t=t.replace(/\./g,''); }
  const n=parseFloat(t); return isFinite(n)&&n>0? Math.round(n*100)/100 : 0;
}
const fmtNum = n => n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtBRL = n => 'R$ '+fmtNum(n||0);
const dayKey = iso => 'd'+String(iso).replace(/-/g,'');
const EXCAT={voo:'Passagens',hotel:'Hospedagem',carro:'Carro',refeicao:'Restaurantes',atracao:'Atrações',outro:'Atrações'};
function firstDay(id){ const pl=actPlacements(id); return pl.length? pl[0][1].day : ''; }
function expActs(){
  return Object.values(S.acts).map(a=>({a,v:parseBRL(a.paid)})).filter(x=>x.v>0).map(x=>Object.assign(x,{day:firstDay(x.a.id)}));
}
function expExtras(iso){
  const m=((S.meta&&S.meta.exp)||{})[dayKey(iso)]||{};
  return Object.entries(m).map(([id,e])=>({id,d:(e&&e.d)||'Outras despesas',v:+(e&&e.v)||0,ts:(e&&e.ts)||0})).filter(e=>e.v>0).sort((a,b)=>a.ts-b.ts);
}
function dayExpense(iso){
  const acts=expActs().filter(x=>x.day===iso), ex=expExtras(iso);
  return {acts,ex,total:acts.reduce((s,x)=>s+x.v,0)+ex.reduce((s,e)=>s+e.v,0)};
}
function tripExpense(){
  const acts=expActs(); let extras=0; DAYS.forEach(d=>expExtras(d.iso).forEach(e=>extras+=e.v));
  return {acts,extras,total:acts.reduce((s,x)=>s+x.v,0)+extras};
}
function dayExpHTML(iso){
  const t=dayExpense(iso).total;
  return `<div class="dexp"><button class="dsum" data-act="dayexp" data-day="${iso}">Gastos do dia<b class="${t>0?'pos':''}">${fmtBRL(t)}</b></button><button class="db" data-act="extra" data-day="${iso}">＋ Despesa</button><button class="db" data-act="extrato">Extrato</button></div>`;
}
function spendHTML(a,p){

function saveEdit(){
  const root=$('#editform'); const pid=root.dataset.pid; const g=n=>{const e=root.querySelector(`[name="${n}"]`);return e?e.value:'';};
  const isNew=!pid; const cat=g('cat'); const name=g('name').trim(); if(!name){toast('Dê um nome à atividade');return;}
  const old=isNew?defaultAct(cat):S.acts[S.plan[pid].act];
  const f={}; (FIELDS[cat]||[]).forEach(([k])=>{ const v=g('f_'+k).trim(); if(v) f[k]=v; });
  const wd=[...root.querySelectorAll('input[name="wd"]:checked')].map(e=>+e.value);
  const details=g('details').split('\n').map(s=>s.trim()).filter(Boolean).map(s=>{const i=s.indexOf(': ');return i<0?{k:'',v:s}:{k:s.slice(0,i),v:s.slice(i+2)};});
  const day=g('day'); const sched=g('sched'); const buy=g('buy');
  let schedDone=root.querySelector('input[name="schedDone"]').checked;
  if(buy==='done'&&old.buy!=='done'&&sched==='date'&&!schedDone) schedDone=true;
  const act=Object.assign({},old,{cat,name,cover:g('cover')||null,cost:g('cost')||null,buy,sched,schedDone,schedDate:g('schedDate'),schedTime:g('schedTime'),code:g('code').trim(),paid:g('paid').trim(),req:g('req'),hint:g('hint').trim(),mapq:g('mapq').trim(),openWd:wd.length?wd:null,f,details,notes:g('notes')});
  if(sched==='date'&&schedDone&&!act.schedDate) act.schedDate=day;
  const upd={};
  const pl={day,time:g('time'),slot:g('slot'),role:g('role'),tag:g('tag').trim()};
  if(isNew){
    act.id='x'+uid(); upd['acts.'+act.id]=act;
    const np=Object.assign({act:act.id,done:false,order:0},pl); np.order=computeOrder(day,np);
    upd['plan.p_'+act.id+'_'+day.slice(8)]=np;
  } else {
    upd['acts.'+act.id]=act;
    const cur=S.plan[pid]; const np=Object.assign({},cur,pl);
    if(day!==cur.day||pl.time!==cur.time||pl.slot!==cur.slot) np.order=computeOrder(day,np,pid);
    upd['plan.'+pid]=np;
    if(day!==UI.day) UI.day=day;
  }
  if(isNew){ UI.tab='dias'; UI.day=day; UI.open.add('p_'+act.id+'_'+day.slice(8)); saveUI(); }
  closeSheet(); commit(upd); toast('Salvo');
}

/* ---------- Eventos ---------- */
document.addEventListener('click',e=>{
  if(e.target.closest('a')) return;
  const t=e.target.closest('[data-act]'); if(!t) return;
  if(e.target.closest('input,select,textarea')&&t.dataset.act==='toggle') return;
  const act=t.dataset.act, pid=t.dataset.pid, id=t.dataset.id, v=t.dataset.v, day=t.dataset.day;
  switch(act){
    case 'tab': UI.tab=v; saveUI(); closeSheet(); render(); window.scrollTo(0,0); break;
    case 'day': UI.day=v; saveUI(); render(); window.scrollTo(0,0); break;
    case 'toggle': UI.open.has(pid)?UI.open.delete(pid):UI.open.add(pid); render(); break;
    case 'done': { const p=S.plan[pid]; commit({['plan.'+pid+'.done']:!p.done}); break; }
    case 'menu': menuSheet(pid); break;
    case 'edit': editSheet(pid); break;
    case 'saveedit': saveEdit(); break;
    case 'sheetclose': closeSheet(); break;
    case 'move': moveSheet(pid,'move'); break;
    case 'dup': moveSheet(pid,'dup'); break;
    case 'moveto': { const p=S.plan[pid]; const np=Object.assign({},p,{day}); np.order=computeOrder(day,np,pid); closeSheet(); UI.day=day; saveUI(); commit({['plan.'+pid]:np}); toast('Movido para '+dayShort(day)); break; }
    case 'dupto': { const p=S.plan[pid]; closeSheet(); UI.day=day; saveUI(); addPlace(p.act,day,{role:p.role,slot:p.slot,time:p.time,tag:p.tag}); toast('Repetido em '+dayShort(day)); break; }
    case 'setrole': closeSheet(); commit({['plan.'+pid+'.role']:v}); break;
    case 'unplace': closeSheet(); commit({['plan.'+pid]:DEL}); toast('Tirado do dia. Continua na biblioteca.'); break;
    case 'deactivate': closeSheet(); commit({['acts.'+id+'.active']:false}); toast('Desativada. Reative em Mais.'); break;
    case 'reactivate': commit({['acts.'+id+'.active']:true}); toast('Reativada'); break;
    case 'delact': if(confirm('Excluir de vez? Isso remove a atividade e todos os cards dela.')){ const upd={['acts.'+id]:DEL}; actPlacements(id).forEach(([k])=>upd['plan.'+k]=DEL); commit(upd);} break;
    case 'rain': UI.rain=!UI.rain; render(); break;
    case 'spend': spendSheet(id); break;
    case 'spendok': { const n=parseBRL(($('#spv')||{}).value); if(!n){ toast('Digite o valor gasto'); break; } closeSheet(); commit({['acts.'+id+'.paid']:fmtNum(n)}); toast('Gasto lançado: '+fmtBRL(n)); break; }
    case 'spenddel': closeSheet(); commit({['acts.'+id+'.paid']:''}); toast('Valor removido'); break;
    case 'extra': extraSheet(day); break;
    case 'extrapick': { const i=$('#exd'); if(i) i.value=v; const j=$('#exv'); if(j) j.focus(); break; }
    case 'extraok': { const n=parseBRL(($('#exv')||{}).value); if(!n){ toast('Digite o valor'); break; } const d=(($('#exd')||{}).value||'').trim()||'Outras despesas'; closeSheet(); commit({['meta.exp.'+dayKey(day)+'.'+uid()]:{d,v:n,ts:Date.now()}}); toast('Despesa lançada: '+fmtBRL(n)); break; }
    case 'extradel': commit({['meta.exp.'+dayKey(day)+'.'+id]:DEL}); dayExpSheet(day); break;
    case 'dayexp': dayExpSheet(day); break;
    case 'extrato': goExtrato(); break;
    case 'theme': setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'); break;
    case 'organize': UI.organize=!UI.organize; render(); break;
    case 'up': case 'down': {
      const list=placements(UI.day); const i=list.findIndex(([k])=>k===pid); const j=act==='up'?i-1:i+1; if(i<0||j<0||j>=list.length) break;
      const arr=list.map(([k])=>k); [arr[i],arr[j]]=[arr[j],arr[i]]; const upd={}; arr.forEach((k,n)=>upd['plan.'+k+'.order']=(n+1)*10); commit(upd); break; }
    case 'sortbytime': {
      const list=placements(UI.day).map(([k,p],i)=>({k,key:sortKey(p),i})); list.sort((a,b)=>((a.key==null?99999:a.key)-(b.key==null?99999:b.key))||a.i-b.i);
      const upd={}; list.forEach((x,n)=>upd['plan.'+x.k+'.order']=(n+1)*10); commit(upd); toast('Ordenado por horário'); break; }
    case 'setstatus': {
      const field=t.dataset.field, a=S.acts[id]; const upd={};
      if(field==='buy'){ upd['acts.'+id+'.buy']=v; if(v==='done'&&a.sched==='date'&&!a.schedDone){ upd['acts.'+id+'.schedDone']=true; if(!a.schedDate){ const pl=actPlacements(id)[0]; if(pl) upd['acts.'+id+'.schedDate']=pl[1].day; } } }
      else upd['acts.'+id+'.schedDone']=v==='1';
      commit(upd); break; }
    case 'quickbuy': { const a=S.acts[id]; const upd={['acts.'+id+'.buy']:'done'}; if(a.sched==='date'&&!a.schedDone){ upd['acts.'+id+'.schedDone']=true; if(!a.schedDate){ const pl=actPlacements(id)[0]; if(pl) upd['acts.'+id+'.schedDate']=pl[1].day; } } commit(upd); toast('Registrado. Se tiver nº, preencha no card.'); break; }
    case 'quicksched': commit({['acts.'+id+'.schedDone']:true}); toast('Registrado. Ajuste data e hora no card.'); break;
    case 'goto': { closeSheet(); const p=S.plan[pid]; UI.tab='dias'; UI.day=p.day; UI.open.add(pid); saveUI(); render(); setTimeout(()=>{const el=document.querySelector(`[data-pid="${pid}"].card`); if(el) el.scrollIntoView({block:'center'});},50); break; }
    case 'infoacc': UI.infoOpen[v]=!UI.infoOpen[v]; saveUI(); render(); break;
    case 'openadd': addSheet(day||UI.day); break;
    case 'search': searchSheet(''); setTimeout(()=>{const i=$('#sq'); if(i) i.focus();},300); break;
    case 'addfilter': addSheet(day,v,($('#addq')||{}).value); break;
    case 'addplace': { closeSheet(); UI.day=day; saveUI(); if(UI.tab!=='dias'){UI.tab='dias';} addPlace(id,day); toast('Adicionado a '+dayShort(day)); break; }
    case 'create': editSheet(null,day); break;
    case 'signin': if(CLOUD.signIn) CLOUD.signIn().catch(err=>{UI.err=err.message||String(err);render();}); break;
    case 'signout': if(CLOUD.signOut) CLOUD.signOut(); break;
    case 'export': { const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='guia-gramado-2026-backup.json'; a.click(); break; }
    case 'reset': if(confirm('Restaurar o roteiro original? Suas edições, marcações e números de reserva serão perdidos.')){ replaceAll(window.buildSeed()); toast('Roteiro restaurado'); } break;
  }
});

const KEEP=['buy','schedDone','schedDate','schedTime','code','paid','notes'];
let migrating=false;
function migrateUpd(){
  const seed=window.buildSeed(); const upd={};
  Object.values(seed.acts).forEach(sa=>{
    const cur=S.acts[sa.id];
    if(!cur){ upd['acts.'+sa.id]=sa; return; }
    if(V2_ACTS.includes(sa.id)){
      const m=Object.assign({},sa,{active:cur.active});
      KEEP.forEach(k=>{ if(cur[k]!=null&&cur[k]!=='') m[k]=cur[k]; });
      if(cur.buy==='done') m.buy='done';
      upd['acts.'+sa.id]=m;
    } else {
      if(sa.mapq&&!cur.mapq) upd['acts.'+sa.id+'.mapq']=sa.mapq;
      if(sa.city&&!cur.city) upd['acts.'+sa.id+'.city']=sa.city;
    }
  });
  if(S.plan.p_brilho_natal_06) upd['plan.p_brilho_natal_06']=DEL;
  if(S.plan.p_brilho_natal_05) upd['plan.p_brilho_natal_05.role']='fixo';
  else upd['plan.p_brilho_natal_05']=seed.plan.p_brilho_natal_05;
  if(S.plan.p_rua_coberta_05){ upd['plan.p_rua_coberta_05.role']='opc'; upd['plan.p_rua_coberta_05.tag']='Conflita com o Brilho'; }
  if(!S.plan.p_rua_coberta_09) upd['plan.p_rua_coberta_09']=seed.plan.p_rua_coberta_09;
  if(S.plan.p_descida_noel_05) upd['plan.p_descida_noel_05.tag']='Em Canela, ~15 min de carro';
  if(S.plan.p_casa_pietro_10_2) upd['plan.p_casa_pietro_10_2.tag']='Cedo: sair até 18h (portões 18h30)';
  if(S.plan.p_kongo_09) upd['plan.p_kongo_09.time']='20:00';
  upd['meta.seedV']=2;
  return upd;
}
const V3_ACTS=['hector','caminho_luzes','catedral','noel_canela','vale_dino','parque_caracol','alpen_park','big_land','ita_caffe','estacao_crepe','saint_honore','pinolo','cafe_hotel','hotel','carro'];

function normalizeUpd(upd){
  const keys=Object.keys(upd);
  keys.forEach((k,ik)=>{
    keys.forEach((c,ic)=>{
      if(c===k||!(k in upd)||!(c in upd)||!c.startsWith(k+'.')) return;
      if(ic<ik || upd[k]===DEL){ delete upd[c]; return; }
      const sub=c.slice(k.length+1).split('.'); const o=Object.assign({},upd[k]); let t=o;
      for(let i=0;i<sub.length-1;i++){ t[sub[i]]=Object.assign({},t[sub[i]]); t=t[sub[i]]; }
      if(upd[c]===DEL) delete t[sub[sub.length-1]]; else t[sub[sub.length-1]]=upd[c];
      upd[k]=o; delete upd[c];
    });
  });
  return upd;
}

  if(S.acts.descida_noel||upd['acts.descida_noel']) upd['acts.descida_noel']=DEL;
  Object.keys(Object.assign({},S.plan)).forEach(pid=>{ if(S.plan[pid].act==='descida_noel') upd['plan.'+pid]=DEL; });
  const put=(pid,fromPid)=>{ const base=seed.plan[pid]; if(!base) return; const old=cur(pid)||(fromPid&&cur(fromPid)); upd['plan.'+pid]=Object.assign({},base,{done:old?!!old.done:false}); if(fromPid&&fromPid!==pid&&cur(fromPid)) upd['plan.'+fromPid]=DEL; };
  ['p_brilho_natal_05','p_vila_natal_05','p_rua_coberta_05','p_super_carros_06','p_olivas_08','p_caminho_luzes_08','p_snowland_09','p_acquamotion_09','p_acquamotion_10','p_rua_coberta_09'].forEach(pid=>put(pid));
  put('p_hector_07','p_hector_08');
  ['les_lys','chalezinho','le_chalet','belle_valais','chez_lys'].forEach(a=>{ put('p_'+a+'_08','p_'+a+'_07'); });
  if(S.plan.p_snowland_10) upd['plan.p_snowland_10']=DEL;
  if(S.plan.p_rua_coberta_08) upd['plan.p_rua_coberta_08']=DEL;
  if(S.plan.p_hector_08&&!upd['plan.p_hector_08']) upd['plan.p_hector_08']=DEL;
  upd['meta.seedV']=6; return upd;
}
const V7_ACTS=['mundo_vapor','olivas','snowland','acendimento','hector'];
function migrateV7(upd){
  const seed=window.buildSeed();
  V7_ACTS.forEach(id=>{
    const sa=seed.acts[id], c=S.acts[id]; if(!sa) return;
    const m=Object.assign({},sa);
    if(c){ KEEP.forEach(k=>{ if((k==='schedDate'||k==='schedTime')&&!c.schedDone) return; if(c[k]!=null&&c[k]!=='') m[k]=c[k]; }); if(c.buy==='done') m.buy='done'; m.active=c.active; }
    if(id==='acendimento') m.active=true;
    upd['acts.'+id]=m;
  });
  const cur=k=>S.plan[k];
  const put=(pid,fromPid)=>{ const base=seed.plan[pid]; if(!base) return; const old=cur(pid)||(fromPid&&cur(fromPid)); upd['plan.'+pid]=Object.assign({},base,{done:old?!!old.done:false}); if(fromPid&&fromPid!==pid&&cur(fromPid)) upd['plan.'+fromPid]=DEL; };
  put('p_mundo_vapor_10','p_mundo_vapor_07'); put('p_olivas_10','p_olivas_08'); put('p_acendimento_05'); put('p_catedral_07'); put('p_hector_07');
  if(S.plan.p_mundo_vapor_07&&!upd['plan.p_mundo_vapor_07']) upd['plan.p_mundo_vapor_07']=DEL;
  if(S.plan.p_olivas_08&&!upd['plan.p_olivas_08']) upd['plan.p_olivas_08']=DEL;
  upd['meta.seedV']=7; return upd;
}
function migrateV8(upd){
  const sa=window.buildSeed().acts.snowland, c=S.acts.snowland; if(!sa) return upd;
  const m=Object.assign({},sa);
  if(c){ KEEP.forEach(k=>{ if((k==='schedDate'||k==='schedTime')&&!c.schedDone) return; if(c[k]!=null&&c[k]!=='') m[k]=c[k]; }); if(c.buy==='done') m.buy='done'; m.active=c.active; }
  upd['acts.snowland']=m; upd['meta.seedV']=8; return upd;
}
const V9_ACTS=['kongo','chalezinho','almoco_quilombo','ita_caffe','zoo','vila_natal','acendimento','hector','desfile','nativitaten','brilho_natal','hotel'];
function migrateV9(upd){
  const seed=window.buildSeed();
  V9_ACTS.forEach(id=>{
    const sa=seed.acts[id], c=S.acts[id]; if(!sa) return;
    const m=Object.assign({},sa);
    if(c){ KEEP.forEach(k=>{ if((k==='schedDate'||k==='schedTime')&&!c.schedDone) return; if(c[k]!=null&&c[k]!=='') m[k]=c[k]; }); if(c.buy==='done') m.buy='done'; m.active=c.active; if(c.f){ m.f=Object.assign({},c.f,sa.f); } }
    const prev=upd['acts.'+id]; if(prev&&prev!==DEL&&prev.active!=null) m.active=prev.active;
    upd['acts.'+id]=m;
  });
  const cur=k=>S.plan[k];
  const put=(pid,fromPid)=>{ const base=seed.plan[pid]; if(!base) return; const old=cur(pid)||(fromPid&&cur(fromPid)); upd['plan.'+pid]=Object.assign({},base,{done:old?!!old.done:false}); if(fromPid&&fromPid!==pid&&cur(fromPid)) upd['plan.'+fromPid]=DEL; };
  ['p_chalezinho_08','p_les_lys_08','p_kongo_09','p_ita_caffe_10'].forEach(pid=>put(pid));
  if(S.plan.p_osteria_09) upd['plan.p_osteria_09']=DEL;
  upd['meta.seedV']=9; return upd;
}
function maybeMigrate(){
  const v=(S.meta&&S.meta.seedV)||1;
  if(migrating || v>=9) return;
  migrating=true;
  let upd = v<2 ? migrateUpd() : {};
  if(v<3) upd = migrateV3(upd);
  if(v<4) upd = migrateV4(upd);
  if(v<5) upd = migrateV5(upd);
  if(v<6) upd = migrateV6(upd);
  if(v<7) upd = migrateV7(upd);
  if(v<8) upd = migrateV8(upd);
  upd = migrateV9(upd);
  commit(normalizeUpd(upd)); toast('Roteiro atualizado (v9). Suas marcações e números foram mantidos.');
}

/* ---------- Boot: Firebase ou local ---------- */
function startLocal(){
  try{ const raw=localStorage.getItem(LS_STATE); S= raw? JSON.parse(raw): window.buildSeed(); }catch(e){ S=window.buildSeed(); }
  if(!S.meta) S.meta={}; if(!S.meta.checks) S.meta.checks={};
  saveLocal(); UI.sync='local'; UI.phase='app'; render(); maybeMigrate();
}
async function startCloud(){
  UI.phase='boot'; render();
  const v='10.12.5', base='https://www.gstatic.com/firebasejs/'+v+'/';
  try{
    const [appM,authM,fsM]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
    const app=appM.initializeApp(CFG.firebase); const auth=authM.getAuth(app);
    let db; try{ db=fsM.initializeFirestore(app,{localCache:fsM.persistentLocalCache({tabManager:fsM.persistentMultipleTabManager()})}); }catch(e){ db=fsM.getFirestore(app); }
    const ref=fsM.doc(db,'trips',CFG.tripId||'gramado-2026');
    CLOUD.ref=ref; CLOUD.updateDoc=fsM.updateDoc; CLOUD.setDoc=fsM.setDoc; CLOUD.deleteField=fsM.deleteField;
    CLOUD.signIn=async()=>{ const prov=new authM.GoogleAuthProvider(); try{ await authM.signInWithPopup(auth,prov); }catch(e){ if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment','auth/web-storage-unsupported'].includes(e.code)) await authM.signInWithRedirect(auth,prov); else throw e; } };
    CLOUD.signOut=()=>authM.signOut(auth);
    let unsub=null;
    authM.onAuthStateChanged(auth,user=>{
      if(unsub){unsub();unsub=null;} CLOUD.ready=false;
      if(!user){ UI.user=null; UI.phase='login'; render(); return; }
      const allowed=(CFG.allowedEmails||[]).map(s=>s.toLowerCase());
      if(allowed.length && !allowed.includes((user.email||'').toLowerCase())){ UI.err='A conta '+user.email+' não tem acesso a este guia.'; UI.phase='login'; render(); authM.signOut(auth); return; }
      UI.user=user; UI.err='';
      unsub=fsM.onSnapshot(ref,{includeMetadataChanges:true},snap=>{
        if(!snap.exists()){ if(!snap.metadata.fromCache){ fsM.setDoc(ref,clean(window.buildSeed())).catch(e=>{UI.err='Sem permissão para gravar: '+e.message;UI.phase='login';render();}); } return; }
        const d=snap.data(); S={acts:d.acts||{},plan:d.plan||{},meta:Object.assign({checks:{}},d.meta||{})}; if(!S.meta.checks) S.meta.checks={};
        CLOUD.ready=true; UI.phase='app'; UI.sync= snap.metadata.hasPendingWrites?'saving':(snap.metadata.fromCache?'offline':'ok'); render(); if(!snap.metadata.fromCache) maybeMigrate();
      },err=>{ UI.err=(err.code==='permission-denied'?'Sem permissão. Confira as regras do Firestore e o e-mail autorizado.':err.message); UI.phase='login'; render(); });
    });
  }catch(e){ UI.err='Falha ao iniciar o Firebase: '+(e.message||e); UI.phase='login'; render(); }
}
window.addEventListener('load',()=>{
  $('#backdrop').addEventListener('click',closeSheet);
  if(CFG.firebase && CFG.firebase.apiKey) startCloud(); else { CFG.firebase=null; startLocal(); }
});
})();
